{% load static %}

<html>
<head>
    <title>Sign In</title>

    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/cerulean/bootstrap.css" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>
    <h3>Sign In</h3>

    {% if not request.user.is_authenticated %}
    <form action="" method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <br> <br>
        <button class="btn btn-primary"> Submit </button>
    </form>

    {% else %}
    <p> You are already signed in. Would you like to <a href="{% url 'signOut' %}">sign out</a>? </p>

    {% endif %}

    {% include 'navbar.html' %}
</body>
</html>
