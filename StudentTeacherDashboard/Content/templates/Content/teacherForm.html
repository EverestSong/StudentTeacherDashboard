{% load static %}

<html>
<head>
    <title>Teacher Registration</title>

    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/cerulean/bootstrap.css" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>
    <h3>Teacher Registration Form</h3>

    <form action="" method="post">
        {% csrf_token %}

        <h4>Account Details</h4>
        <table>
            {{ account_form.as_table }}
        </table>

        <br> 

        <h4>Teacher Details</h4>
        <table>
            {{ teacher_form.as_table }}
        </table>

        <br> 

        <button class="btn btn-primary"> Submit </button>
    </form>

    {% include 'navbar.html' %}
</body>
</html>
