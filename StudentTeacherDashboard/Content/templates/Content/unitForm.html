<head>
    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/cerulean/bootstrap.css" />

    <style>
        body {
            margin: 0;
            padding: 10px;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
        }

        table th label {
            font-weight: normal;
        }
    </style>
</head>

<html>
<head>
    <title>Unit Registration</title>
</head>

<body>
    <h3>Unit Registration Form</h3>

    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <br> <br>
        <button class="btn btn-primary"> Submit </button>
    </form>

    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'studentForm' %}">Student Registration</a>
    <a href="{% url 'teacherForm' %}">Teacher Registration</a>
    <a href="{% url 'unitForm' %}">Unit Registration</a>
    <a href="{% url 'unitOutlineForm' %}">Unit Outline Generator</a>
</body>
</html>
